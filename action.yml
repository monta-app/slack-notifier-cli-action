name: "Slack Notifier CLI"
description: "Send or update a slack notification"
inputs:
  job-type:
    description: "one of: test, build, deploy, publishDocs"
    required: true
  job-status:
    description: "one of: progress, success, failure, cancelled, unknown"
    required: true
  service-name:
    description: "The name of your service (if you don't like the default)"
    required: false
  service-emoji:
    description: "The emoji you want to use for your service!"
    required: false
  slack-app-token:
    description: ""
    required: true
  slack-channel-id:
    description: ""
    required: true
  slack-message-id:
    description: "The id of a previously published message to be updated"
    required: false
  fail-on-error:
    description: "Whether to fail the workflow step if the Slack notification fails (e.g. channel not found). Set to 'false' to emit a warning instead."
    required: false
    default: "false"
outputs:
  slack-message-id:
    description: "Slack message id that was published"
    value: ${{ steps.slack-notifier.outputs.SLACK_MESSAGE_ID }}
  slack-notification-result:
    description: "Result of the notification attempt: 'success' or 'failed'"
    value: ${{ steps.slack-notifier.outputs.SLACK_NOTIFICATION_RESULT }}
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download slack-notifier-cli
      run: |
        # Detect architecture
        ARCH=$(uname -m)
        if [ "$ARCH" = "x86_64" ]; then
          BINARY_NAME="slack-notifier-cli-X64"
        elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
          BINARY_NAME="slack-notifier-cli-ARM64"
        else
          echo "Unsupported architecture: $ARCH"
          exit 1
        fi

        echo "Downloading $BINARY_NAME for architecture $ARCH"
        curl -L -o slack-notifier-cli https://github.com/monta-app/slack-notifier-cli/releases/download/v1.3.21/$BINARY_NAME
        chmod +x ./slack-notifier-cli
      shell: bash
    - name: Run slack notifier cli
      id: slack-notifier
      env:
        PUBLISH_SLACK_JOB_TYPE: ${{ inputs.job-type }}
        PUBLISH_SLACK_JOB_STATUS: ${{ inputs.job-status }}
        PUBLISH_SLACK_SERVICE_NAME: ${{ inputs.service-name }}
        PUBLISH_SLACK_SERVICE_EMOJI: ${{ inputs.service-emoji }}
        SLACK_APP_TOKEN: ${{ inputs.slack-app-token }}
        SLACK_CHANNEL_ID: ${{ inputs.slack-channel-id }}
        SLACK_MESSAGE_ID: ${{ inputs.slack-message-id }}
      run: |
        if ./slack-notifier-cli; then
          echo "SLACK_NOTIFICATION_RESULT=success" >> "$GITHUB_OUTPUT"
        else
          EXIT_CODE=$?
          echo "SLACK_NOTIFICATION_RESULT=failed" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.fail-on-error }}" = "true" ]; then
            echo "::error::Slack notification failed (exit code $EXIT_CODE)"
            exit $EXIT_CODE
          else
            echo "::warning::Slack notification failed (exit code $EXIT_CODE) — continuing because fail-on-error is disabled"
          fi
        fi
      shell: bash
